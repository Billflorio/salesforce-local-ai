version: 1.0.5

endpoints:
  google:
    models:
      default:
        - gemini-2.0-flash
        - gemini-2.5-flash
        - gemini-2.5-pro
      fetch: true
    titleConvo: true
    titleModel: "gemini-2.0-flash"

  custom:
    - name: "Local Ollama"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1"
      models:
        default: [ "qwen2.5:1.5b", "llama3.1:8b" ]
        fetch: true
      titleConvo: true
      titleModel: "qwen2.5:1.5b"
      summarize: false
      summarizeModel: "qwen2.5:1.5b"

speech:
  stt:
    openai:
      url: "http://whisper:8000/v1/audio/transcriptions"
      apiKey: "dummy"
      model: "Systran/faster-whisper-tiny.en"
