version: 1.1.5
cache: true
endpoints:
  google:
    models:
      default:
        - gemini-2.0-flash
        - gemini-2.5-flash
        - gemini-2.5-pro
      fetch: true
    titleConvo: true
    titleModel: "gemini-2.0-flash"

  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://librechat-ollama:11434/v1"
      models:
        default: ["llama3.1"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summarizeModel: "qwen2.5:1.5b"

speech:
  stt:
    openai:
      url: "http://whisper:8000/v1/audio/transcriptions"
      apiKey: "dummy"
      model: "Systran/faster-whisper-tiny.en"
