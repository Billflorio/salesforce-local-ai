version: 1.0.5

endpoints:
  google:
    models:
      default:
        - gemini-3.8-flash
        - gemini-2.5-flash
        - gemini-2.5-pro
        - gemini-2.0-flash
      fetch: false
    titleConvo: true
    titleModel: "gemini-3.8-flash"

  custom:
    - name: "Local Ollama"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1"
      models:
        default: [ "qwen2.5:1.5b", "llama3.1:8b" ]
        fetch: true
      titleConvo: true
      titleModel: "qwen2.5:1.5b"
      summarize: false
      summarizeModel: "qwen2.5:1.5b"
